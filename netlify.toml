[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://www.pronormusa.com https://pronormusa.com https://estimator.pronormusa.com"

# /.netlify/functions/* is routed by Netlify before any redirect, so the SPA
# catch-all below never shadows it (a redirect rule for that path is invalid).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
